<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Request | Connexion administrateur</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">

        <div class="background-orb orb-blue"></div>
        <div class="background-orb orb-purple"></div>
        <div class="background-grid"></div>


        <!-- =========================
             LOGO SKOLAE
             ========================= -->

        <div class="skolae-logo">

            <div class="logo-text">
                SKOLAE
            </div>

            <div class="eyes">

                <div class="eye">
                    <div class="pupil"></div>
                </div>

                <div class="eye">
                    <div class="pupil"></div>
                </div>

            </div>

        </div>


        <!-- =========================
             CONNEXION ADMIN
             ========================= -->

        <section class="welcome-section">

            <div class="welcome-badge">
                ✦ ESPACE ADMINISTRATEUR
            </div>

            <div class="decoration"></div>

            <h1>
                Connexion
                <span>Administrateur</span>
            </h1>

            <p class="description">
                Connectez-vous à votre espace administrateur
                pour gérer les demandes de l'établissement.
            </p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <!-- =========================
                 FORMULAIRE
                 ========================= -->

            <form method="post" class="auth-form">

                <div class="form-group">

                    <label for="email">
                        Email administrateur
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@myskolae.fr"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        minlength="12"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                    id="adminLoginButton"
                >
                    <span>Se connecter</span>
                    <span class="arrow">→</span>
                </button>
                


            </form>


            <a
                href="{{ url_for('choix_auth') }}"
                class="back-link"
            >
                ← Retour au choix du compte
            </a>


            <p class="bottom-text">
                Campus Request · Espace administrateur
            </p>

        </section>

    </main>


    <!-- =========================
         YEUX
         ========================= -->

    <script>

        const pupils =
            document.querySelectorAll(".pupil");

        const eyes =
            document.querySelectorAll(".eye");


        document.addEventListener(
            "mousemove",
            function (event) {

                pupils.forEach(function (pupil) {

                    const eye =
                        pupil.parentElement;

                    const eyeRect =
                        eye.getBoundingClientRect();

                    const eyeCenterX =
                        eyeRect.left
                        + eyeRect.width / 2;

                    const eyeCenterY =
                        eyeRect.top
                        + eyeRect.height / 2;

                    const angle =
                        Math.atan2(
                            event.clientY - eyeCenterY,
                            event.clientX - eyeCenterX
                        );

                    const distance = 5;

                    const x =
                        Math.cos(angle) * distance;

                    const y =
                        Math.sin(angle) * distance;

                    pupil.style.transform =
                        `translate(${x}px, ${y}px)`;

                });

            }
        );


        function blink() {

            eyes.forEach(function (eye) {
                eye.classList.add("closed");
            });

            setTimeout(function () {

                eyes.forEach(function (eye) {
                    eye.classList.remove("closed");
                });

            }, 180);

        }


        setInterval(blink, 5000);


        const adminLoginButton =
            document.getElementById("adminLoginButton");


        adminLoginButton.addEventListener(
            "click",
            function () {

                eyes.forEach(function (eye) {
                    eye.classList.add("closed");
                });

            }
        );

    </script>

</body>

</html>
