<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Request | Créer un compte</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">

        <div class="background-orb orb-blue"></div>
        <div class="background-orb orb-purple"></div>
        <div class="background-grid"></div>


        <!-- =========================
             LOGO SKOLAE
             ========================= -->

        <div class="skolae-logo">

            <div class="logo-text">
                SKOLAE
            </div>

            <div class="eyes">

                <div class="eye">
                    <div class="pupil"></div>
                </div>

                <div class="eye">
                    <div class="pupil"></div>
                </div>

            </div>

        </div>


        <!-- =========================
             CHOIX DU COMPTE
             ========================= -->

        <section class="welcome-section">

            <div class="welcome-badge">
                ✦ CRÉATION DE COMPTE
            </div>

            <div class="decoration"></div>

            <h1>
                Créer votre
                <span>compte</span>
            </h1>

            <p class="description">
                Pour commencer, indiquez le type de compte
                que vous souhaitez créer.
            </p>


            <div class="buttons">

                <!-- COMPTE ÉLÈVE -->

                <a
                    href="{{ url_for('register') }}"
                    class="btn btn-primary"
                >
                    <span>Je suis élève</span>
                    <span class="arrow">→</span>
                </a>


                <!-- COMPTE ADMIN -->

                <a
                    href="{{ url_for('admin_register') }}"
                    class="btn btn-secondary"
                >
                    <span>Je suis administrateur</span>
                    <span class="arrow">→</span>
                </a>

            </div>


            <a
                href="{{ url_for('auth_home') }}"
                class="back-link"
            >
                ← Retour
            </a>


            <p class="bottom-text">
                Campus Request · Skolae
            </p>

        </section>

    </main>


    <!-- =========================
         YEUX
         ========================= -->

    <script>

        const pupils =
            document.querySelectorAll(".pupil");

        const eyes =
            document.querySelectorAll(".eye");


        document.addEventListener(
            "mousemove",
            function (event) {

                pupils.forEach(function (pupil) {

                    const eye =
                        pupil.parentElement;

                    const eyeRect =
                        eye.getBoundingClientRect();

                    const eyeCenterX =
                        eyeRect.left
                        + eyeRect.width / 2;

                    const eyeCenterY =
                        eyeRect.top
                        + eyeRect.height / 2;

                    const angle =
                        Math.atan2(
                            event.clientY - eyeCenterY,
                            event.clientX - eyeCenterX
                        );

                    const distance = 5;

                    const x =
                        Math.cos(angle) * distance;

                    const y =
                        Math.sin(angle) * distance;

                    pupil.style.transform =
                        `translate(${x}px, ${y}px)`;

                });

            }
        );


        function blink() {

            eyes.forEach(function (eye) {
                eye.classList.add("closed");
            });

            setTimeout(function () {

                eyes.forEach(function (eye) {
                    eye.classList.remove("closed");
                });

            }, 180);

        }


        setInterval(blink, 5000);

    </script>

</body>

</html>
