<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Request | Vérification</title>
</head>
<body>
    <h1>Vérification de l'adresse email</h1>

    <p>
        Un code de vérification a été envoyé à votre adresse email scolaire.
    </p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        <label for="confirmation_code">Code de vérification :</label>
        <input
            type="text"
            id="confirmation_code"
            name="confirmation_code"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            required
        >

        <button type="submit">Confirmer</button>
    </form>
</body>
</html>
