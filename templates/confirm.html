{% extends "base.html" %}
{% block title %}Validation du compte - Campus Request{% endblock %}
{% block content %}
    <h2>Validation de votre adresse</h2>
    <p>Un code à 6 chiffres a été expédié à <strong>{{ email }}</strong>.</p>
    <form method="POST">
        <label>Code de vérification :</label>
        <input type="text" name="code" maxlength="6" placeholder="123456" required>
        <button type="submit">Valider mon compte</button>
    </form>
{% endblock %}
