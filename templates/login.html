{% extends "base.html" %}
{% block title %}Connexion - Campus Request{% endblock %}
{% block content %}
    <h2>Connexion</h2>
    <form method="POST">
        <label>Adresse mail Skolae :</label>
        <input type="email" name="email" required>
        <label>Mot de passe :</label>
        <input type="password" name="password" required>
        <button type="submit">Se connecter</button>
    </form>
    <p style="margin-top: 15px;">Pas encore de compte ? <a href="{{ url_for('register') }}">Inscription</a></p>
{% endblock %}
